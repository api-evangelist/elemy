name: Elemy
description: >-
  Elemy (formerly Sprout Therapy) was a US pediatric behavioral-health startup providing in-home
  Applied Behavior Analysis (ABA) therapy for children with autism, reaching unicorn valuation on
  backing from SoftBank Vision Fund, General Catalyst, and 8VC. In late 2022 it wound down its
  direct-care therapy division and pivoted to software; in 2023 it rebranded to Tilly
  (tillytherapy.com), a HIPAA-compliant ABA practice-management and AI platform covering intake,
  scheduling, authorizations, billing, payroll, and family engagement for autism-care providers.
  The original elemy.com domain no longer resolves. Tilly is a closed SaaS product with no
  public developer API, developer portal, or published API documentation as of this profile.
